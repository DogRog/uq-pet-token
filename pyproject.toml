[project]
name = "uq-pet"
version = "0.1.0"
description = "Compare uncertainty and random token acquisition for online PET NER training"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=5.5.0",
    "datasets==2.19.2",
    "marimo>=0.23.16",
    "mcp>=2.1.1",
    "numpy>=1.26",
    "polars>=1.0",
    "pydantic>=2.12",
    "python-dotenv>=1.2",
    "rich>=14.3",
    "sentencepiece>=0.2",
    "seqeval>=1.2.2",
    "torch>=2.12.1",
    "transformers>=5.12.1",
    "wandb>=0.25",
    "wigglystuff>=0.2.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uq_pet"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "notebooks", "scripts"]

[tool.ruff.format]
# Pinned to today's defaults so `ruff format` can't restyle the tree on a ruff upgrade.
quote-style = "double"
indent-style = "space"
line-ending = "lf"
# The knob behind the one-argument-per-line signature style: a trailing comma after the
# last element ("magic trailing comma") keeps a signature or call exploded, and dropping
# that comma lets the formatter collapse it onto one line when it fits in line-length.
# So the comma is the author's switch — leave this false or the switch stops working.
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "D"]
# D1xx ("missing docstring") is off: this repo documents what needs explaining and leaves
# self-evident helpers and the test suite bare. The rest of D still governs the shape of
# the docstrings that do exist.
ignore = [
    "D1",
    # D403 wants the first word capitalized, but docstrings here open with the identifier
    # under discussion (`asdict() would emit...`) and capitalizing it would misname it.
    "D403",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# A marimo cell renders its final expression; Ruff sees that expression as unused.
"notebooks/*.py" = ["B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["notebooks"]
