[project]
name = "uq-pet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets==2.19.2",
    "dotenv>=0.9.9",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "mlx>=0.31.2; sys_platform == 'darwin'",
    "mlx-lm>=0.31.3,<0.32; sys_platform == 'darwin'",
    "openai>=2.44.0",
    "pandas>=3.0.3",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "seqeval>=1.2.2",
    "torch>=2.12.1",
    "tqdm>=4.66",
    "transformers>=5.12.1",
]

[project.scripts]
uq-pet = "uq_pet.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uq_pet"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # pytest.importorskip must run before the import under test
