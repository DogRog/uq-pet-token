# Local white-box grid: Qwen3-4B-4bit via in-process mlx_lm (Apple Silicon).
# The mlx backend caches per-token predictive entropies, enabling the
# white-box uncertainty:predictive_entropy strategy alongside the black-box ones.
budgets: [10, 25, 50, 100]
strategies:
  - random
  # - uncertainty:mean_token_entropy      # black-box baseline
  # - uncertainty:sequence_entropy        # black-box baseline
  - uncertainty:predictive_entropy      # white-box (needs the mlx cache)
repeats: 5

llm:
  backend: mlx
  model: mlx-community/Qwen3-4B-4bit
  num_samples: 5
  temperature: 0.7
  max_tokens: 1024
  seed: 3407

train:
  checkpoint: distilbert-base-cased
  epochs: 20
  batch_size: 8
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_fraction: 0.1
  max_length: 256
