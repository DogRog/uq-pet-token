# Does it matter *which* single demonstration the prompt gets? Same 1-shot setup as
# nhr_gemma4_1shot.yaml, a different draw: few_shot_seed 1 instead of 13.
#
# Read the gap vs. random, not the absolute F1. The few-shot seed decides which
# sentences leave the pool, so this run's pool and its cache indices are not the other
# run's — a different prompt *and* a slightly different training pool. The arm-vs-random
# comparison inside each run survives that; "1-shot seed 1 scores higher than seed 13"
# would not mean much.
#
# Its own cache (nhr_gemma4_pool_fs1s13 -> ..._fs1s1_...), so this config scores the
# pool from scratch — budget the API time.

budget_pct: [10, 20, 30]

arms:
  - random
  - avg_neg_logprob_filtered
  - vote_entropy
  - pairwise_f1_disagreement
  - entity_count_std
  - least_confident
  - length
  - strategy: confident
    metric: avg_neg_logprob_filtered

train_seeds: [0, 1, 2]

n_few_shot: 1
few_shot_seed: 1

llm:
  cache_prefix: nhr_gemma4
  n_samples: 10
  top_logprobs: 5
