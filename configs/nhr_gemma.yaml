# Real run: score the 328-sentence pool with gemma through the NHR@FAU gateway, then
# fine-tune distilbert on the 10% most-uncertain sentences vs. a random 10%.
#
# The `llm` block below reproduces the existing cache at
# data/processed/llm_scores/nhr_gemma_pool_dist.jsonl. If you change any sampling
# field, change cache_suffix too — otherwise load_cache rejects every cached record
# (model/params mismatch) and the pool is re-scored from scratch.

budget_pct: [5, 10, 25, 30]

# One arm per line. `strategy` is "random" (the control) or a metric registered in
# uncertainty.py; every other key is a parameter of that metric. Add `label:` to
# rename an arm in the results. Cost is budgets x arms x train_seeds trainings.
arms:
  - strategy: random
  - strategy: avg_neg_logprob
    tokens: filtered     # tag-id tokens only
  - strategy: avg_neg_logprob
    tokens: pure         # every token in the response
  - strategy: output_disagreement
    measure: vote_entropy   # how much the 5 sampled tag arrays disagree; no logprobs
  - strategy: output_disagreement
    measure: disagreement   # the same, as a plain off-the-plurality fraction

selection_seed: 42
tie_seed: 0              # used in rank_by_uncertainty() to prevent order bias for equal scores
train_seeds: [0, 1]

# Few-shot demonstrations in the LLM prompt. These also decide which sentences are held
# out of the pool, so a non-default pair scores into its own cache file
# (nhr_gemma_pool_fs<n>s<seed>_dist.jsonl) — i.e. a full re-scoring pass.
n_few_shot: 5
few_shot_seed: 42

llm:
  model: RedHatAI/gemma-4-31B-it-FP8-block
  base_url: https://hub.nhr.fau.de/api/llmgw/v1
  api_key_env: NHR_FAU_API_KEY
  cache_prefix: nhr_gemma
  cache_suffix: dist
  n_samples: 5
  temperature: 1.0
  seed: 0
  max_tokens: 256
  logprobs: true
  workers: 8
  timeout: 120.0
  max_retries: 5

train:
  checkpoint: distilbert-base-cased
  epochs: 20
  batch_size: 8
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_fraction: 0.1
  max_length: 256
  eval_batch_size: 32
