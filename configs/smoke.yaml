# Cheap sanity run over the whole pipeline (~2 minutes, no API calls).
#
# It deliberately omits every `llm` sampling field so LLMConfig's defaults apply —
# and those defaults are exactly what produced the existing
# data/processed/llm_scores/nhr_gemma_pool_dist.jsonl, so this config hits that cache
# and never reaches the network. Run it with --skip-scoring to enforce that:
#
#   uv run python -m uq_pet.main --config configs/smoke.yaml --skip-scoring

budget_pct: [3]        # -> max(1, int(328 * 0.03)) = 9 sentences per arm
arms:
  - random
  - avg_neg_logprob_filtered
  - vote_entropy
train_seeds: [0]

llm:
  workers: 4

train:
  epochs: 2
  max_length: 128
