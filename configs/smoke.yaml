# Small end-to-end BERT-UQ run. It still requires the checkpoint weights locally or
# downloads them once; no API key or LLM gateway is involved.
budget_pct: [3]
arms:
  - random
  - mean_token_entropy
model_seeds: [0]

uq:
  bootstrap_epochs: 1
  score_batch_size: 32

train:
  checkpoint: distilbert-base-cased
  epochs: 1
  batch_size: 8
  max_length: 128
  eval_batch_size: 32
