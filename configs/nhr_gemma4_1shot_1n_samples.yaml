budget_pct: [5, 10, 15, 20, 25, 30]

arms:
  - random
  - avg_neg_logprob_filtered
  - least_confident
  - length
  - strategy: confident
    metric: avg_neg_logprob_filtered

train_seeds: [0, 1, 2, 3, 4]

n_few_shot: 1
few_shot_seed: 13

llm:
  cache_prefix: nhr_gemma4
  # A single sample is a different sampling recipe, and the filename does not encode
  # the recipe — without this suffix these records land in the 10-sample config's
  # cache, where each run evicts the other's and re-scores the whole pool.
  cache_suffix: n1
  n_samples: 1
  top_logprobs: 5
