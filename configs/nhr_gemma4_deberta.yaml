# microsoft/deberta-v3-base: the strongest base-size encoder here, and the slowest —
# disentangled attention roughly triples distilbert's step time. Run it last.
#
# Shares nhr_gemma4_1shot's score cache (same LLM, few-shot split and sampling recipe),
# so this run costs no API calls once that cache exists.
#
# NOTE the recipe is not the baseline's: DeBERTa-v3 diverges at 5e-5, so the learning
# rate is the usual 2e-5. As in nhr_gemma4_roberta, that confounds checkpoint with
# learning rate across configs but leaves the arm-vs-random comparison inside this
# config intact — every arm here trains on the same recipe.

budget_pct: [10, 20, 30]

arms:
  - random
  - avg_neg_logprob_filtered
  - vote_entropy
  - pairwise_f1_disagreement
  - entity_count_std
  - least_confident
  - length
  - strategy: confident
    metric: avg_neg_logprob_filtered

train_seeds: [0, 1, 2]

n_few_shot: 1
few_shot_seed: 13

llm:
  model: RedHatAI/gemma-4-31B-it-FP8-block
  base_url: https://hub.nhr.fau.de/api/llmgw/v1
  api_key_env: NHR_FAU_API_KEY
  cache_prefix: nhr_gemma4
  n_samples: 10
  temperature: 1.0
  seed: 0
  max_tokens: 256
  logprobs: true
  top_logprobs: 5
  workers: 8
  timeout: 120.0
  max_retries: 5

train:
  checkpoint: microsoft/deberta-v3-base
  epochs: 20
  batch_size: 8
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_fraction: 0.1
  max_length: 256
  eval_batch_size: 32
