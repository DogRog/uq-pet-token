budget_pct: [10, 20, 30]

arms:
  - strategy: random
    seed: 13
    label: random
  - avg_neg_logprob_filtered
  - vote_entropy
  - pairwise_f1_disagreement
  - entity_count_std
  - least_confident
  - length
  - strategy: confident
    metric: avg_neg_logprob_filtered

train_seeds: [0, 1, 2]

n_few_shot: 1
few_shot_seed: 13

llm:
  model: gpt-oss-120b
  # GPT-OSS cannot disable reasoning. Low effort keeps the classification run lean;
  # its reasoning and final tag array share max_tokens, so use a generous ceiling.
  # The suffix records both changes and keeps this recipe out of the old cache.
  cache_prefix: nhr_oss
  cache_suffix: topk2-rlow-t4096
  n_samples: 10
  reasoning_effort: low
  max_tokens: 4096
  top_logprobs: 5
