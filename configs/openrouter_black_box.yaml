# Copy to a .yaml file, choose a model/provider, and add OPENROUTER_API_KEY to .env.
budget_pct: [5, 10, 25]

# These arms read generated tag arrays only; none requires token logprobs.
arms:
  - random
  - vote_entropy
  - disagreement
  - pairwise_f1_disagreement
  - entity_count_std
  - length

train_seeds: [0, 1, 2]

llm:
  backend: openrouter
  model: deepseek/deepseek-v4-flash-0731
  cache_prefix: openrouter_deepseek-v4-flash-0731
  cache_suffix: black_box
  n_samples: 5
  temperature: 1.0
  seed: 0
  max_tokens: 256
  logprobs: false
  workers: 8
  timeout: 120.0
  max_retries: 5

  # This object is passed as OpenAI SDK `extra_body` and is part of cache identity.
  # For the cleanest experiment, add `only: [provider-slug]` and keep fallbacks off,
  # so all samples come from one provider endpoint/quantization.
  extra_body:
    provider:
      allow_fallbacks: false
      require_parameters: true

  # Optional OpenRouter app attribution headers.
  # openrouter_site_url: https://example.org/uq-pet
  openrouter_app_name: uq-pet

