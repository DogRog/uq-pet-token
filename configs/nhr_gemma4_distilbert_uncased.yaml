# Casing ablation: distilbert-base-uncased against the cased baseline in
# nhr_gemma4_1shot.yaml. Same size and speed, so this is the cheap control for the
# other three checkpoint configs — PET sentences are lowercase-heavy process
# descriptions, and how much the cased vocabulary is worth here is not obvious.
#
# Shares nhr_gemma4_1shot's score cache (same LLM, few-shot split and sampling recipe),
# so this run costs no API calls once that cache exists. Recipe is the baseline's
# unchanged, so `checkpoint` is the only difference.

budget_pct: [10, 20, 30]

arms:
  - random
  - avg_neg_logprob_filtered
  - vote_entropy
  - pairwise_f1_disagreement
  - entity_count_std
  - least_confident
  - length
  - strategy: confident
    metric: avg_neg_logprob_filtered

train_seeds: [0, 1, 2]

n_few_shot: 1
few_shot_seed: 13

llm:
  cache_prefix: nhr_gemma4
  n_samples: 10
  top_logprobs: 5

train:
  checkpoint: distilbert-base-uncased
