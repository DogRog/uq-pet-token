# Local white-box grid for a CUDA server: Qwen3-4B via in-process transformers.
# The hf backend caches per-token predictive entropies, enabling the white-box
# uncertainty:predictive_entropy strategy alongside the black-box ones.
# Same model family/size as grid_qwen.yaml (mlx), so results are comparable.
budgets: [10, 25, 50, 100]
strategies:
  - random
  - uncertainty:mean_token_entropy      # black-box baseline
  - uncertainty:sequence_entropy        # black-box baseline
  - uncertainty:predictive_entropy      # white-box (needs a local-backend cache)
repeats: 5
# Grid cells trained concurrently (worker processes sharing the GPU); each
# cell seeds itself, so results are independent of this value.
workers: 8

llm:
  backend: hf
  model: Qwen/Qwen3-4B
  num_samples: 5
  temperature: 0.7
  max_tokens: 1024
  seed: 3407
  # Sentences per batched generate call (× num_samples rows decoding in
  # parallel). 8 → 40-wide batches; raise until the GPU runs out of memory.
  batch_size: 8

train:
  checkpoint: distilbert-base-cased
  epochs: 20
  batch_size: 8
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_fraction: 0.1
  max_length: 256
