# Local white-box grid for a CUDA server: Gemma 4 26B-A4B (MoE, ~4B active)
# via in-process transformers, loaded in 4-bit (bitsandbytes NF4) so the
# weights fit a single GPU. The hf backend caches per-token predictive
# entropies, enabling the white-box uncertainty:predictive_entropy strategy
# alongside the black-box ones.
budgets: [10, 25, 50, 100]
strategies:
  - random
  - uncertainty:mean_token_entropy      # black-box baseline
  - uncertainty:sequence_entropy        # black-box baseline
  - uncertainty:predictive_entropy      # white-box (needs a local-backend cache)
repeats: 5
# Grid cells trained concurrently (worker processes sharing the GPU); each
# cell seeds itself, so results are independent of this value.
workers: 8

llm:
  backend: hf
  model: google/gemma-4-26B-A4B-it
  quantization: 4bit
  num_samples: 5
  temperature: 0.7
  max_tokens: 1024
  seed: 3407
  # Sentences per batched generate call (× num_samples rows decoding in
  # parallel). 8 → 40-wide batches; raise until the GPU runs out of memory.
  batch_size: 8

train:
  checkpoint: distilbert-base-cased
  epochs: 20
  batch_size: 8
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_fraction: 0.1
  max_length: 256
