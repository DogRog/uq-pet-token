budget_pct: [10, 20, 30]

arms:
  - random
  - avg_neg_logprob_filtered
  - vote_entropy
  - pairwise_f1_disagreement
  - entity_count_std
  - least_confident
  - length
  - strategy: confident
    metric: avg_neg_logprob_filtered

train_seeds: [0, 1, 2]

n_few_shot: 1
few_shot_seed: 13

llm:
  model: mistralai/Mistral-Medium-3.5-128B
  cache_prefix: nhr_mistral
  n_samples: 10
  top_logprobs: 5
