budget_pct: [10, 20, 30]

arms:
  - random
  - avg_neg_logprob_filtered
  - vote_entropy
  - pairwise_f1_disagreement
  - entity_count_std
  - least_confident
  - length
  - strategy: confident
    metric: avg_neg_logprob_filtered

train_seeds: [0, 1, 2]

n_few_shot: 1
few_shot_seed: 13

llm:
  model: mistralai/Mistral-Medium-3.5-128B
  base_url: https://hub.nhr.fau.de/api/llmgw/v1
  api_key_env: NHR_FAU_API_KEY
  n_samples: 10
  temperature: 1.0
  seed: 0
  max_tokens: 256
  logprobs: true
  top_logprobs: 5
  workers: 8
  timeout: 120.0
  max_retries: 5

train:
  checkpoint: distilbert-base-cased
  epochs: 20
  batch_size: 8
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_fraction: 0.1
  max_length: 256
  eval_batch_size: 32
