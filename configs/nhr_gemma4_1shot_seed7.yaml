# Third draw of the single demonstration: few_shot_seed 7. With nhr_gemma4_1shot
# (seed 13) and nhr_gemma4_1shot_seed1 (seed 1) that is three prompts differing only in
# which sentence they show, which is the smallest honest answer to "how much does the
# example choice move the result?".
#
# As in the seed-1 config: compare gaps vs. random across the three, not absolute F1 —
# each seed holds out a different sentence, so each has its own pool, its own cache and
# its own test split. Scores the pool from scratch.

budget_pct: [10, 20, 30]

arms:
  - random
  - avg_neg_logprob_filtered
  - vote_entropy
  - pairwise_f1_disagreement
  - entity_count_std
  - least_confident
  - length
  - strategy: confident
    metric: avg_neg_logprob_filtered

train_seeds: [0, 1, 2]

n_few_shot: 1
few_shot_seed: 7

llm:
  model: RedHatAI/gemma-4-31B-it-FP8-block
  base_url: https://hub.nhr.fau.de/api/llmgw/v1
  api_key_env: NHR_FAU_API_KEY
  cache_prefix: nhr_gemma4
  n_samples: 10
  temperature: 1.0
  seed: 0
  max_tokens: 256
  logprobs: true
  top_logprobs: 5
  workers: 8
  timeout: 120.0
  max_retries: 5

train:
  checkpoint: distilbert-base-cased
  epochs: 20
  batch_size: 8
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_fraction: 0.1
  max_length: 256
  eval_batch_size: 32
