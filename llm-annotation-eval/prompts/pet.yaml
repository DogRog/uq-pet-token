# PET's mention and relation types, filled into mentions.txt and relations.txt (see README.md).
# Each description is one paragraph: YAML joins its lines with spaces (">-").
mentions:
  types:
    Activity: >-
      an active task or action executed during the business process, e.g., "examine", "write",
      "bake", "review". Do not extract, if it is information about the process itself, such as
      "the process ends", as this is not a task in the process! Can also be an event during
      the process, that is executed by an external, implicit actor, that is not mentioned in
      the text, e.g., "placed" in "when an order is placed". Never contains the Actor that
      executes it, nor the Activity Data that's used during this Activity, is just the verb as
      in "checked" and not "is checked"!
    Actor: >-
      a person, department, or similar role that participates actively in the business
      process, e.g., "the student", "the professor", "the judge", "the clerk". It should only
      be extracted, if the current sentence describes the actor executing a task. Include the
      determiner if it is present, e.g. extract "the student" from "First the student studies
      for their exam". Can also be a pronoun, such as "he", "I", "she".
    Further Specification: >-
      important information about an activity, such as the mean, the manner of execution, or
      how an activity is executed. Follows an Activity in the same sentence, and describes how
      an Activity (task) is being done.
    XOR Gateway: >-
      textual representation of a decision in the process, usually triggered by adverbs or
      conjunctions, e.g., "if", "otherwise", "when"
    Activity Data: >-
      a physical object, or digital data that is relevant to the process, because an action
      produces or uses it, e.g., "the paper", "the report", "the machine part". Always include
      the determiner! Can also be a pronoun, like "it", but is always part of a task
      description. Is never information about the process itself, as in "the process ends",
      here "process" is not Activity Data!
    AND Gateway: >-
      textual description of parallel work streams in the process, i.e., simultaneous actions
      performed, marked by phrases like, e.g., "while", "meanwhile", "at the same time"
    Condition Specification: >-
      defines the condition of an XOR Gateway path usually directly following the gateway
      trigger word, e.g., "it is ready", "the claim is valid", "temperature is above 180"
  # the output lines separate text, type and sentence with a tab
  example: |-
    **Examples for the format given the input text:**

    *Input*:

    Sentence 0: the professor grades all student papers .
    Sentence 1: some time passes .
    Sentence 2: then the professor returns the papers .

    *Output*:

    the professor	Actor	0
    grades	Activity	0
    all student papers	Activity Data	0
    the professor	Actor	2
    returns	Activity	2
    the papers	Activity Data	2

relations:
  types:
    uses: >-
      Focus on mentions of type "activity". Find the "activity_data" mention, that is being
      used or created during the execution of this activity. If you find one, extract a
      relation of type "uses". The source mention is the activity, the target mention is the
      "activity_data" mention.
    flow: >-
      Focus on mentions of types "Activity", "XOR_Gateway", "AND_Gateway", and
      "Condition_Specification". If a condition_specification follows an XOR_Gateway connect
      the XOR_Gateway (source) to the Condition_Specification (target). If an Activity,
      XOR_Gateway, or AND_Gateway follows an Activity, connect the one appearing earlier
      (head) with the latter one (target). If an Activity, XOR_Gateway, AND_Gateway, or
      Condition_Specification follows an Activity, XOR_Gateway, AND_Gateway, or Condition
      Specification, connect the earlier one (source) to the latter one (target).
    actor performer: >-
      Focus on mentions of type "activity" and look for the "actor", that actively performs
      the activity (not is passively affected by it!). If you find one, extract a relation of
      type "actor performer". The source mention is the "activity", and the target mention is
      the "actor".
    actor recipient: >-
      Focus on mentions of type "activity" and look for the "actor", that receives the result
      of some activity execution, i.e., they are passively affected by the activity. If you
      find one, extract a relation of type "actor recipient". The source mention is the
      "Activity", the target mention is the "Actor".
    same gateway: >-
      Textual descriptions of gateways are often spread over several phrases, especially the
      different outgoing paths, this relation links these disjointed descriptions together.
      Look for elements of type "xor_gateway" and "and_gateway". If you find another mention
      of the same type, check if they describe the same decision point in the process
      execution. If they do, extract a relation of type "same gateway", with the source
      mention being the one that appears earlier in the text, and the target mention being the
      one that appears later.
    further specification: >-
      Focus on mentions of type "activity". Try and find mentions of type
      "further_specification", that describe how this activity has to be executed, or describe
      the activity further. If you find one, extract a relation of type
      "further_specification", where the source mention is the activity and the target mention
      is the mention of type "further_specification".
  # the output lines separate type, source and target with a tab
  example: |-
    **Examples for the format given the input text:**

    *Input*:

    the <actor id=1> LLM </actor> <activity id=0> extracts </activity> <activity_data id=2> the text </activity> .

    *Output*

    actor performer	0	1
    uses	0	2
