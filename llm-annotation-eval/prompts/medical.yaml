# MedicalProcessInstruks' mention types, procedure, disambiguation hints and format example,
# filled into mentions.txt (see README.md). The dataset tags its types by id (T03 ... T43), so the
# types keep those names; each description starts with the name its authors gave the type, from
# the label definitions they shared. Written after its annotations: short verbs and nouns for
# activities, headings for parent activities, and single words that relate activities as in DCR
# graphs. Every quoted example is from the training sentences, never the test split.
mentions:
  types:
    T03: >-
      Activity: a task performed in the guideline, usually only its verb or the noun naming the
      action, e.g. "performed", "injected", "Observe", or "administration" in "from insulin
      administration"; a passive auxiliary can be part of it, e.g. "is given". An examination
      named as the thing done is an Activity too, e.g. "PET scan". Without who performs it, what
      it uses or how it is done.
    T05: >-
      Parent Activity: the name of a procedure or case that groups the steps after it, usually a
      heading, e.g. "New patient heparinization", "Conventional treatment", "Contraindications",
      "Insulin-dependent diabetes".
    T09: >-
      Observation: a finding, condition, diagnosis or state of the patient that the guideline
      reacts to, e.g. "Pregnancy", "residual urine", "Postoperative pain", "bacteremia",
      "reduced eGFR", "Renal transplant recipients"; also a state given by a verb, e.g.
      "receiving" in "patients receiving more than 2500 IU".
    T11: >-
      Input: a measurement or piece of information that an activity reads or checks, e.g.
      "eGFR", "blood test results", "Blood pressure", "Pulse", "Heart rhythm", or a result it can
      have, e.g. "physiologic", "abnormal" or "probably pathologic".
    T15: >-
      Queue: an activity that hands the patient over to, or asks, another party, e.g. "consult" in
      "consult with ovl".
    T17: >-
      Specification: further information about how an activity is done or about the data it uses:
      its manner, route, place, time, frequency or other detail, e.g. "per os", "every 8 hours",
      "x 3 daily", "IV contrast", "in the venous chamber", "preoperatively", "locally",
      "as usual". Often several words.
    T19: >-
      Guard: a threshold, time limit or amount that an activity depends on, usually a number
      with a unit or a comparison, e.g. "more than 2500 IU", "< 45 mL / min", "> 3 cm",
      "At least 2 hours", "6 hours", "the day before", "within 14 days".
    T21: >-
      Purpose: why an activity is done or what it achieves, usually a phrase or clause, e.g.
      "pain management", "to apply the pump", "keep the breast dry", "Essential for pain", or
      "she can lean over the baby when breastfeeding" in "so that she can lean over the baby
      when breastfeeding".
    T23: >-
      And: a word that joins activities or conditions that all apply, e.g. "and", "+",
      "as well as", "together with".
    T25: >-
      Or: a word that joins alternatives of which one or more apply, e.g. "or", "and / or".
    T27: >-
      Xor: a word that starts the alternative to what came before, so that only one of them
      happens, e.g. "Otherwise".
    T29: >-
      Response: a word that marks that an activity must follow once another has happened or a
      finding holds, e.g. "Then", "requires" in "pathologic and requires treatment".
    T31: >-
      Inclusion: a word that marks that an activity becomes part of the process from that point
      on, e.g. because of a finding.
    T33: >-
      Condition: a word that makes an activity depend on a condition, or on another activity
      happening first, e.g. "If", "In case of", "before", "after", "until", "When".
    T35: >-
      Inclusion Response: a word that both adds an activity to the process and makes it
      required, e.g. "In case of" in "In case of doubt or renewed meteorism : CT-OOA".
    T37: >-
      Condition Response: a word that makes an activity depend on a condition and also follow
      once it holds, e.g. "later" in "Fifteen minutes later , the patient is injected",
      "followed by", "and finally".
    T39: >-
      Exclusion: a word that marks an activity as not done, stopped or replaced, e.g.
      "must not", "not suitable", "Unless", "Instead", or "until" in "take a break from
      breastfeeding until the warts have healed".
    T41: >-
      Actor: a person or role who performs or receives an activity, e.g. "the mother",
      "anesthesiologist", "radiology staff", "hemodialysis nurse", or "patient" in "the patient
      is injected".
    T43: >-
      Activity Data: a drug, substance, device, document or examination that an activity uses,
      gives or produces, e.g. "insulin", "Gabapentin", "contrast agent", "CT scan",
      "antidiabetic medication", "Tablet paracetamol ( Pamol )".
  # the steps to take, a chain of thought; the answer itself is only the mention lines
  procedure: |-
    Go through the text sentence by sentence, using the other sentences as context:

    1. Find the headings that name a procedure or case, the Parent Activities (T05).
    2. Find the Activities (T03), Observations (T09), Inputs (T11) and Queues (T15).
    3. For each Activity, find its Actor (T41), Activity Data (T43), Specifications (T17), Guards (T19) and Purpose (T21).
    4. Find the words that relate the activities: And (T23), Or (T25), Xor (T27), Response (T29), Inclusion (T31), Condition (T33), Inclusion Response (T35), Condition Response (T37) and Exclusion (T39).
  # sentences with the mentions they contain, for types that are easily mistaken
  disambiguation: |-
    - In "Gabapentin 100 - 300 mg every 8 hours .", "Gabapentin" is Activity Data (T43) and "every 8 hours" a Specification (T17).
    - In "patients receiving more than 2500 IU", "receiving" is an Observation (T09) and "more than 2500 IU" a Guard (T19), as the activity depends on that amount.
    - In "If a fungal infection is suspected , treat with an antifungal agent", "If" is a Condition (T33); in "If retention is < 1000 ml * , the patient is started on alpha-blocker therapy", "If" is a Condition Response (T37), as the therapy must then follow.
  # uq-pet-token's bootstrap sentences (res/gold/<dataset>-bootstrap.jsonl, the labelled sentences
  # its token classifiers start from) with their mentions: sentences are "<i>: <words>" lines, as
  # the documents are given; mentions one line per mention, text, type and sentence separated by
  # a tab
  example: |-
    ### Input Example

    {{sentences}}

    ### Output Example

    {{mentions}}
