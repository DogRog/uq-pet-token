# MedicalProcessInstruks' mention types, procedure, disambiguation hint and format example,
# filled into mentions.txt (see README.md). The dataset names none of its types (T03 ... T43), so
# the descriptions are generated from its training sentences (never the test split), with the
# texts and settings below. {{name}} marks a value filled in for each type.
mentions:
  # how many of a type's most frequent texts its description lists
  texts_per_type: 10
  # for a type with training mentions; mention_count is e.g. "163 mentions" or "1 mention", texts
  # the most frequent texts in quotes, separated by commas
  description: >-
    a type the dataset does not name. Its most frequent texts among the {{mention_count}} in the
    training sentences: {{texts}}
  # for a type without training mentions
  description_unseen: >-
    a type the dataset does not name. It does not occur in the training sentences.
  # the steps to take, a chain of thought; the answer itself is only the mention lines
  procedure: |-
    Go through the text sentence by sentence, using the other sentences as context:

    1. Compare the words and phrases of the sentence with the frequent texts listed for each type.
    2. Extract every word or phrase that is like the texts of one of the types, with that type.
  disambiguation: |-
    If a word or phrase could be of several types, choose the type whose listed texts it is most similar to, in meaning and in length.
  # uq-pet-token's bootstrap sentences (res/gold/<dataset>-bootstrap.jsonl, the labelled sentences
  # its token classifiers start from) with their mentions: sentences are "<i>: <words>" lines, as
  # the documents are given; mentions one line per mention, text, type and sentence separated by
  # a tab
  example: |-
    ### Input Example

    {{sentences}}

    ### Output Example

    {{mentions}}
