[project]
name = "llm-annotation-eval"
version = "0.1.0"
description = "LLM-based annotation of business process descriptions (PET) and its evaluation"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy",
    "spacy~=3.8.7",
    "openai==2.6.0",
    "nltk==3.9.2",
    "dotenv==0.9.9",
    "en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl#sha256=5e6329fe3fecedb1d1a02c3ea2172ee0fede6cea6e4aefb6a02d832dba78a310",
    "rich>=15.0.0",
    "langextract==1.7.0",
]

[tool.uv]
# scripts are run directly from src/, there is nothing to build or install
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# the scripts import autoannotate, eval and data from src/, so the tests do too
pythonpath = ["src"]
testpaths = ["tests"]
